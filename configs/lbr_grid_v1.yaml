# First configuration grid for the label-free configuration-selection study
# (3 chunk sizes x 3 retrievers x 2 embedders x 2 rerank settings = 36 configs).
dataset:
  name: legalbench_rag
  path: ../datasets/legalbenchrag
  sampling: lbr_mini
eval_ks: [1, 4, 16, 64]
output_dir: results

base:
  chunking: {strategy: recursive, chunk_overlap: 0}
  top_k: 64
  candidate_k: 100

grid:
  chunking.chunk_size: [256, 500, 1000]
  retriever: [dense, bm25, hybrid]
  embedding_model: [intfloat/e5-large-v2, Qwen/Qwen3-Embedding-0.6B]
  reranker: [null, BAAI/bge-reranker-v2-m3]
