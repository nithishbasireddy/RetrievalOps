# Same 30-config grid evaluated on SYNTHETIC questions (naive), for the synthetic-QA proxy.
# Retrieval runs over the official full LegalBench-RAG corpus; only the queries are synthetic.
# 3 chunk sizes x {dense e5, dense qwen3, bm25, hybrid e5, hybrid qwen3} x {no rerank, rerank} = 30.
# Shard by chunk size (one GPU each):
#   CUDA_VISIBLE_DEVICES=1 retrievalops run configs/lbr_synth_naive_v1.yaml --match "chunk_size=256__" --run-name lbr_synth_naive_v1
dataset:
  name: legalbench_rag
  path: ../datasets/legalbenchrag
  sampling: none
  query_file: data/synthetic/lbr_synth_naive.json
eval_ks: [1, 4, 16, 64]
output_dir: results

base:
  chunking: {strategy: recursive, chunk_overlap: 0}
  top_k: 64
  candidate_k: 100

grid:
  chunking.chunk_size: [256, 500, 1000]
  retriever: [dense, bm25, hybrid]
  embedding_model: [intfloat/e5-large-v2, Qwen/Qwen3-Embedding-0.6B]
  reranker: [null, BAAI/bge-reranker-v2-m3]
