[project]
name = "retrievalops"
version = "0.2.0"
description = "Reproducible evaluation and configuration selection for retrieval-augmented generation pipelines"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
    "bm25s>=0.2.6",
    "PyStemmer>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
retrievalops = "retrievalops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrievalops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and model downloads (deselect with -m 'not gpu')"]

[tool.ruff]
line-length = 100
